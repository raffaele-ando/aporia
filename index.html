<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aporia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* un solo mondo visivo, scuro per scelta: fondo e colori sempre espliciti */
  :root { color-scheme: dark; --night: #000; --paper: #ece8e1; --home-bg: #000; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); overflow: hidden; }

  #home { position: fixed; inset: 0; display: grid; place-items: center; background: var(--home-bg); padding-inline: 16px; }
  #home h1 {
    margin: 0; font-family: "Italiana", "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
    font-weight: 400; font-size: clamp(56px, 13vw, 200px); line-height: 1;
    letter-spacing: 0.16em; margin-right: -0.16em;
    color: var(--paper); cursor: default; user-select: none; -webkit-user-select: none;
    opacity: 0; transition: opacity .9s ease, letter-spacing 1.1s cubic-bezier(.2,.7,.2,1), margin 1.1s cubic-bezier(.2,.7,.2,1);
  }
  body.home #home h1 { opacity: 1; }
  body:not(.home) #home h1 { letter-spacing: 0.42em; margin-right: -0.42em; }

  /* selettore delle animazioni di apertura */
  :root { --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --dim: #8e8a84; --line: #26241f; --sheet: #0d0c0b; }
  #pick {
    position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    font: 500 11px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--dim);
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; cursor: pointer;
    opacity: 0; transition: opacity .9s ease .4s, color .2s, border-color .2s; white-space: nowrap;
  }
  body.home #pick { opacity: 1; }
  #pick:hover, #pick:focus-visible { color: var(--paper); border-color: #4a463f; outline: none; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; max-height: min(78vh, 640px); overflow-y: auto;
    background: var(--sheet); border-top: 1px solid var(--line);
    padding: 22px max(16px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateY(102%); transition: transform .45s cubic-bezier(.2,.8,.2,1); z-index: 5;
  }
  #sheet.open { transform: none; }
  #sheet header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; max-width: 760px; margin: 0 auto 14px; }
  #sheet h2 { margin: 0; font: 400 26px/1.1 "Italiana", "Didot", serif; letter-spacing: .06em; }
  #sheet .close { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
    background: none; border: 0; padding: 8px 0 8px 8px; cursor: pointer; }
  #sheet .close:hover, #sheet .close:focus-visible { color: var(--paper); outline: none; }
  #list { list-style: none; margin: 0 auto; padding: 0; max-width: 760px; display: grid; }
  #list button {
    width: 100%; display: grid; grid-template-columns: 3.2em 1fr auto; gap: 4px 14px; align-items: baseline;
    text-align: left; background: none; color: var(--paper); border: 0; border-top: 1px solid var(--line);
    padding: 14px 4px; cursor: pointer; font: inherit;
  }
  #list li:last-child button { border-bottom: 1px solid var(--line); }
  #list button:hover, #list button:focus-visible { background: #15130f; outline: none; }
  #list .n { font: 500 12px/1.4 var(--mono); color: var(--dim); font-variant-numeric: tabular-nums; grid-row: span 2; }
  #list .t { font: 400 17px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #list .d { font: 500 11px/1.4 var(--mono); color: var(--dim); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
  #list .s { grid-column: 2 / 4; font: 400 13.5px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--dim); max-width: 60ch; }
  #list .now .n::after { content: " ●"; color: var(--paper); }
  #stage { position: fixed; inset: 0; z-index: 10; background: #000; display: none; }
  #stage.on { display: block; }
  #stage iframe { width: 100%; height: 100%; border: 0; display: block; }
  #stage .bar { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; display: flex; gap: 8px; }
  #stage .bar button { font: 500 11px/1 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--paper);
    background: rgba(0,0,0,.55); border: 1px solid #3a3731; border-radius: 999px; padding: 9px 13px; cursor: pointer; }
  #stage .bar button:focus-visible { outline: 1px solid var(--paper); }
  #stage .label { position: absolute; left: 14px; right: 190px; top: calc(21px + env(safe-area-inset-top, 0px)); font: 500 11px/1 var(--mono);
    letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #intro { position: fixed; inset: 0; background: var(--night); transition: opacity .6s ease; }
  /* il video riempie sempre tutto lo schermo (niente bande nere): il logo sta nella zona centrale
     che resta visibile con qualsiasi proporzione */
  #intro video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--night); }
  body.home #intro { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<main id="home" aria-live="polite"><h1 id="homeTitle">Aporia</h1></main>

<button id="pick" type="button" aria-controls="sheet" aria-expanded="false">Animazioni di apertura</button>
<section id="sheet" aria-label="Animazioni di apertura" aria-hidden="true">
  <header><h2>Animazioni di apertura</h2><button class="close" type="button" id="sheetClose">Chiudi</button></header>
  <ol id="list"></ol>
</section>
<div id="stage" aria-modal="true" role="dialog" aria-label="Anteprima animazione">
  <iframe id="stageFrame" title="Anteprima animazione" allow="autoplay"></iframe>
  <span class="label" id="stageLabel"></span>
  <div class="bar"><button type="button" id="stageAgain">Rivedi</button><button type="button" id="stageClose">Chiudi</button></div>
</div>

<div id="intro" role="img" aria-label="Aporia">
  <video id="film" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
</div>

<script>
(() => {
  'use strict';
  // il video è una simulazione di vento e polvere già calcolata (src/sim_video.py):
  // il telefono deve solo riprodurlo, quindi è fluido ovunque
  const film = document.getElementById('film'), body = document.body;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const portrait = () => window.innerHeight >= window.innerWidth;
  let done = false, watchdog = 0;

  function toHome() {
    if (done) return; done = true;
    clearTimeout(watchdog);
    body.classList.add('home');
    setTimeout(() => { try { film.pause(); } catch (e) {} }, 700);
  }
  function play() {
    done = false; body.classList.remove('home');
    // H.264 (Safari, iPad, Android, Chrome); WebM VP9 dove l'H.264 non c'è
    const ext = film.canPlayType('video/mp4; codecs="avc1.640028"') ? 'mp4' : 'webm';
    film.src = `assets/intro-${portrait() ? 'portrait' : 'landscape'}.${ext}`;
    film.currentTime = 0;
    // se il video non parte (risparmio energetico, rete lenta) si va comunque alla home
    watchdog = setTimeout(toHome, 2500);
    film.addEventListener('playing', () => { clearTimeout(watchdog); watchdog = setTimeout(toHome, 7000); }, { once: true });
    const p = film.play();
    if (p && p.catch) p.catch(toHome);
  }
  // la home compare mentre l'ultima polvere si sta ancora disperdendo
  film.addEventListener('timeupdate', () => { if (film.duration && film.currentTime > film.duration - 0.55) toHome(); });
  film.addEventListener('ended', toHome);
  film.addEventListener('error', toHome);

  document.getElementById('intro').addEventListener('pointerdown', toHome);        // tocco: salta
  window.addEventListener('keydown', e => { if (!done && !e.metaKey && !e.ctrlKey) toHome(); });
  document.getElementById('homeTitle').addEventListener('dblclick', play);         // doppio click: rivedi

  if (reduce) { requestAnimationFrame(toHome); } else play();

  // ---- selettore: tutte le animazioni di apertura fatte finora ---------------------------
  const V = [
    { f: 'v1.html', t: 'Prima versione', d: '8,6 s', s: 'Dal nero la polvere, folate di vento, il logo compare e si sgretola. Il logo è l’SVG animato dal vivo.' },
    { f: 'v2.html', t: 'Logo come immagine', d: '8,6 s', s: 'Stessa sequenza, ma il logo è pre-renderizzato: niente blocchi sui telefoni né tremolio su iPad.' },
    { f: 'v3.html', t: 'Scia di vento', d: '8,6 s', s: 'Il logo arriva col vento trascinando una scia e si ferma nitido; stesso effetto su telefono e desktop.' },
    { f: 'v4.html', t: 'Logo dalla polvere', d: '8,6 s', s: 'Il logo è invisibile e si accende solo dove un granello si posa, da sinistra a destra.' },
    { f: 'v5.html', t: 'Il vento scava il fiume', d: '11 s', s: 'La polvere costruisce una A pulita, poi una folata solleva il fiume e lo trascina nella bandiera.' },
    { f: 'v6.html', t: 'Versione corta', d: '5,3 s', s: 'La stessa storia della precedente, con fasi più rapide e sovrapposte.' },
    { f: 'v7.html', t: 'Raffica continua', d: '5,2 s', s: 'Vento di fondo sempre presente, fasi accavallate, granelli spinti dalla fisica del vento.' },
    { f: 'video.html#v8', t: 'Video: prima simulazione', d: '5 s', s: 'Simulazione fisica di 450.000 granelli resa come video. Il logo si divide in polvere che resta e polvere che vola.' },
    { f: 'video.html#v9', t: 'Video: un solo vento', d: '5 s', s: 'Un vento continuo porta tutto al logo definitivo, passando dalla A. Schermo sempre pieno.' },
    { f: null, t: 'Video: raffica veloce', d: '4,7 s', s: 'Come la precedente, ma la polvere arriva con una raffica rapida e si posa di colpo. È la versione attuale del sito.' },
  ];
  const list = document.getElementById('list'), sheet = document.getElementById('sheet'), pick = document.getElementById('pick');
  const stage = document.getElementById('stage'), frame = document.getElementById('stageFrame'), label = document.getElementById('stageLabel');
  let current = null;
  V.forEach((v, i) => {
    const li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; if (!v.f) b.className = 'now';
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t"></span><span class="d"></span><span class="s"></span>`;
    b.querySelector('.t').textContent = v.t; b.querySelector('.d').textContent = v.d; b.querySelector('.s').textContent = v.s;
    b.addEventListener('click', () => show(i));
    li.appendChild(b); list.appendChild(li);
  });
  function openSheet(o) {
    sheet.classList.toggle('open', o); sheet.setAttribute('aria-hidden', String(!o)); pick.setAttribute('aria-expanded', String(o));
    if (o) setTimeout(() => list.querySelector('button').focus({ preventScroll: true }), 300);
  }
  function show(i) {
    const v = V[i]; openSheet(false);
    if (!v.f) { play(); return; }                       // la versione attuale è la pagina stessa
    current = i; label.textContent = `${String(i + 1).padStart(2, '0')} · ${v.t}`;
    frame.src = 'about:blank';
    stage.classList.add('on');
    requestAnimationFrame(() => { frame.src = 'versioni/' + v.f; });
    document.getElementById('stageClose').focus({ preventScroll: true });
  }
  function closeStage() { stage.classList.remove('on'); frame.src = 'about:blank'; current = null; pick.focus({ preventScroll: true }); }
  pick.addEventListener('click', e => { e.stopPropagation(); openSheet(!sheet.classList.contains('open')); });
  document.getElementById('sheetClose').addEventListener('click', () => openSheet(false));
  document.getElementById('stageClose').addEventListener('click', closeStage);
  document.getElementById('stageAgain').addEventListener('click', () => { if (current !== null) show(current); });
  window.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (stage.classList.contains('on')) closeStage(); else openSheet(false);
  });
})();
</script>
</body>
</html>
