<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aporia</title>
<meta name="description" content="Aporia: animazione d'apertura, tutte le versioni, laboratorio dei colori e file da scaricare.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="preload" as="video" href="assets/intro-portrait.mp4" media="(orientation: portrait)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23000%22/%3E%3Cpath d=%22M7 25 14 7h4l7 18h-4.5L16 13l-4.5 12z%22 fill=%22%23ece8e1%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/sito.css">
<style>
  /* un solo mondo visivo, scuro per scelta: fondo e colori sempre espliciti */
  :root { color-scheme: dark; --night: #000; --paper: #ece8e1; --dim: #8e8a84; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); overflow: hidden; }

  #home { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); padding-inline: 16px; }
  #home h1 {
    margin: 0; font-family: "Italiana", "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
    font-weight: 400; font-size: clamp(56px, 13vw, 200px); line-height: 1;
    letter-spacing: 0.16em; margin-right: -0.16em;
    color: var(--paper); cursor: default; user-select: none; -webkit-user-select: none;
    opacity: 0; transition: opacity .9s ease, letter-spacing 1.1s cubic-bezier(.2,.7,.2,1), margin 1.1s cubic-bezier(.2,.7,.2,1);
  }
  body.home #home h1 { opacity: 1; }
  body:not(.home) #home h1 { letter-spacing: 0.42em; margin-right: -0.42em; }

  /* le altre pagine: in basso, discrete, compaiono con la home */
  #links {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3; justify-content: center;
    padding: 0 16px calc(18px + env(safe-area-inset-bottom, 0px));
    opacity: 0; transform: translateY(6px); transition: opacity .8s ease .5s, transform .8s ease .5s; pointer-events: none;
  }
  body.home #links { opacity: 1; transform: none; pointer-events: auto; }
  #links a { padding: 10px 2px; }

  #intro { position: fixed; inset: 0; z-index: 2; background: var(--night); transition: opacity .6s ease; }
  /* il video riempie sempre tutto lo schermo (niente bande nere) */
  #intro video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--night); }
  body.home #intro { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<main id="home" aria-live="polite"><h1 id="homeTitle">Aporia</h1></main>

<nav class="sitenav" id="links" aria-label="Pagine">
  <a href="versioni.html">Versioni</a>
  <a href="laboratorio.html">Laboratorio</a>
  <a href="download.html">Download</a>
</nav>

<div id="intro" role="img" aria-label="Aporia">
  <video id="film" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
</div>

<script>
(() => {
  'use strict';
  const film = document.getElementById('film'), body = document.body;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ext = film.canPlayType('video/mp4; codecs="avc1.640028"') ? 'mp4' : 'webm';   // H.264 o WebM VP9
  let done = false, watchdog = 0;

  function toHome() {
    if (done) return; done = true;
    clearTimeout(watchdog);
    body.classList.add('home');
    setTimeout(() => { try { film.pause(); } catch (e) {} }, 700);
  }
  function play() {
    done = false; body.classList.remove('home');
    const o = window.innerHeight >= window.innerWidth ? 'portrait' : 'landscape';
    film.src = `assets/intro-${o}.${ext}`; film.currentTime = 0;
    clearTimeout(watchdog);
    watchdog = setTimeout(toHome, 4000);            // se il video non parte si va comunque alla home
    film.addEventListener('playing', () => { clearTimeout(watchdog); watchdog = setTimeout(toHome, 8000); }, { once: true });
    const p = film.play(); if (p && p.catch) p.catch(toHome);
  }
  // la home compare mentre l'ultima polvere si sta ancora disperdendo
  film.addEventListener('timeupdate', () => { if (film.duration && film.currentTime > film.duration - 0.55) toHome(); });
  film.addEventListener('ended', toHome);
  film.addEventListener('error', toHome);

  // tocco o tasto durante il video: si salta alla home; doppio click su "Aporia": si rivede
  document.getElementById('intro').addEventListener('pointerdown', toHome);
  addEventListener('keydown', e => { if (!done && !e.metaKey && !e.ctrlKey) toHome(); });
  document.getElementById('homeTitle').addEventListener('dblclick', play);

  // tornando dalle altre pagine (link "Aporia" in alto) si va direttamente alla home
  if (reduce || location.hash === '#home') { body.classList.add('home'); done = true; }
  else play();
})();
</script>
</body>
</html>
