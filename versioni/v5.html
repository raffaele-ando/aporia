<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aporia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&display=swap">
<style>
  /* un solo mondo visivo, scuro per scelta: fondo e colori sempre espliciti */
  :root {
    color-scheme: dark;
    --night: #050506;      /* nero dell'apertura, leggermente caldo */
    --paper: #ece8e1;      /* testo della home */
    --home-bg: #070708;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); overflow: hidden; }

  #home {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--home-bg); padding-inline: 16px;
  }
  #home h1 {
    margin: 0; font-family: "Italiana", "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
    font-weight: 400; font-size: clamp(56px, 13vw, 200px); line-height: 1;
    letter-spacing: 0.16em; margin-right: -0.16em; /* compensa lo spazio dopo l'ultima lettera */
    color: var(--paper);
    opacity: 0;
    cursor: default; user-select: none; -webkit-user-select: none;
  }

  #intro { position: fixed; inset: 0; background: var(--night); overflow: hidden; }
  #intro.gone { display: none; }
  #intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>

<main id="home" aria-live="polite">
  <h1 id="homeTitle">Aporia</h1>
</main>

<div id="intro" role="img" aria-label="Aporia">

  <canvas id="dust" aria-hidden="true"></canvas>
</div>

    const B = 10, segs = Array.from({ length: B*2 }, () => []);
    return {
      add(x0, y0, x1, y1, a, big) { if (a > 0.01) segs[Math.min(B - 1, (a*B)|0) + (big ? B : 0)].push(x0, y0, x1, y1); },
      flush(c) {
        c.lineCap = 'round';
        for (let k = 0; k < segs.length; k++) {
          const s = segs[k]; if (!s.length) continue;
          c.strokeStyle = `rgba(244,241,235,${(((k % B) + 0.5)/B).toFixed(3)})`;
          c.lineWidth = k >= B ? 1.9 : 1.05;
          c.beginPath();
          for (let i = 0; i < s.length; i += 4) { c.moveTo(s[i], s[i + 1]); c.lineTo(s[i + 2], s[i + 3]); }
          c.stroke(); s.length = 0;
        }
      },
    };
  }
  const air = batch();        // livello della polvere (con scia, come fumo)
  const settle = batch();     // livello del logo (senza scia: i granelli che si posano non lasciano "aghi")
  const queue = air.add;

  // ---- disegno del logo -------------------------------------------------------
  function drawLogo(c, alpha, t, x, y, w, h) {       // il logo finale = polvere rimasta + polvere arrivata
    if (alpha <= 0.002) return;
    c.globalAlpha = alpha; c.globalCompositeOperation = 'source-over';
    c.drawImage(IMG.Bstay, x, y, w, h);
    c.globalCompositeOperation = 'lighter';
    c.drawImage(IMG.Bmove, x, y, w, h);
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  }

  let formed = false, emitIdx = 0, carveFront = -1e9;

  function step(t, dt) {
    // scia: ogni fotogramma la polvere precedente sbiadisce un po', come fumo
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = `rgba(0,0,0,${0.24 + 0.25*smooth(T.home[0], T.end, t)})`; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    const dustA = smooth(T.dustIn[0], T.dustIn[1], t)
                * (1 - 0.55*smooth(T.form[0], T.form[1], t))
                * (1 - smooth(T.exit[1] - 0.4, T.home[1], t));

    // polvere nell'aria
    for (let i = 0; i < ambient.length; i++) {
      const p = ambient[i];
      flow(p.x, p.y, t);
      const k = 1 - Math.exp(-dt*(1.5 + f[2]*5));
      p.vx += (f[0] - p.vx)*k; p.vy += (f[1] - p.vy)*k;
      p.x += p.vx*dt; p.y += p.vy*dt;
      if (p.x > W + 30 || p.x < -30 || p.y > H + 30 || p.y < -30) {  // rinasce altrove, in dissolvenza
        p.x = Math.random()*W; p.y = Math.random()*H; p.born = t;
        flow(p.x, p.y, t); p.vx = f[0]; p.vy = f[1];
      }
      const a = p.a*dustA*smooth(T.dustIn[0] + p.delay, T.dustIn[0] + p.delay + 0.8, t)
              * (p.born ? smooth(p.born, p.born + 0.6, t) : 1);
      const sp = Math.hypot(p.vx, p.vy) || 1, len = Math.min(4 + 22*VS, 0.4 + sp*0.028);
      queue(p.x - p.vx/sp*len, p.y - p.vy/sp*len, p.x, p.y, a, p.big);
    }

    // la seconda folata raccoglie la polvere che forma il logo
    if (!formed && t >= GUSTS[1].t0 + 0.15 && solidTargets.length) {
      formed = true;
      const n = Math.min(Math.round(1400*budget), solidTargets.length);
      // metà dei granelli viene dall'aria: si scelgono a caso e si tolgono in un solo passaggio
      const take = Math.min(n >> 1, Math.max(0, ambient.length - 200)), picked = [];
      for (let i = 0; i < take; i++) {
        const j = i + ((Math.random()*(ambient.length - i))|0);
        const tmp = ambient[i]; ambient[i] = ambient[j]; ambient[j] = tmp; picked.push(ambient[i]);
      }
      ambient = ambient.slice(take);
      for (let i = 0; i < n; i++) {
        const tg = solidTargets[(i*solidTargets.length/n)|0];
        const q = i % 2 === 0 ? picked[i >> 1] : null;
        const jit = (Math.random() - 0.5)*0.22;
        formers.push(q ? { tg, jit, done: 0, x: q.x, y: q.y, vx: q.vx, vy: q.vy, a: 0.3 + tg.l*0.6, born: 0 }
                       : { tg, jit, done: 0, x: -20 - Math.random()*W*0.3, y: box.y + tg.v*box.s + (Math.random() - 0.5)*H*0.6, vx: 300*VS, vy: 0,
                           a: 0.3 + tg.l*0.6, born: t });
      }
    }
    // ogni granello ha il suo momento: il logo si costruisce da sinistra a destra, come soffia il vento
    const rad = 26/Math.sqrt(Math.max(0.3, formers.length/1400));   // meno granelli → sbuffi più larghi
    for (let i = 0; i < formers.length; i++) {
      const p = formers[i];
      if (p.done && t - p.done > 0.5) continue;
      const s0 = T.form[0] - 0.75 + ((p.tg.u - U0)/UW)*0.95 + p.jit;
      const pull = smooth(s0, s0 + 0.75, t);
      const tx = box.x + p.tg.u*box.s, ty = box.y + p.tg.v*box.s;
      flow(p.x, p.y, t);
      const k = 1 - Math.exp(-dt*3);
      p.vx += (f[0]*(1 - pull) - p.vx)*k; p.vy += (f[1]*(1 - pull) - p.vy)*k;
      const ox = p.x, oy = p.y, g = 1 - Math.exp(-dt*7*pull);   // si posa senza rimbalzi
      p.x += p.vx*dt + (tx - p.x)*g; p.y += p.vy*dt + (ty - p.y)*g;
      const d = Math.hypot(tx - p.x, ty - p.y)/box.s;          // distanza dal suo punto, in unità del logo
      // arrivando lascia polvere: prima una traccia leggera lungo il percorso, poi lo sbuffo pieno
      if (!p.done && pull > 0.2 && d < 90) deposit((p.x - box.x)/box.s, (p.y - box.y)/box.s, 0.05*pull, rad*0.7);
      if (!p.done && pull > 0.55 && d < 4) { p.done = t; deposit(p.tg.u, p.tg.v, 0.85, rad); }
      const fade = p.done ? 1 - (t - p.done)/0.5 : 1;
      const af = p.a*fade*(p.born ? smooth(p.born, p.born + 0.6, t) : 1);
      if (pull < 0.35) queue(ox, oy, p.x, p.y, af, false);    // portato dal vento: scia nell'aria
      else {                                                 // in arrivo: granello luminoso che scivola al suo posto
        let dx = p.x - ox, dy = p.y - oy; const L = Math.hypot(dx, dy) || 1, len = Math.min(7*VS, L*1.5);
        settle.add(p.x - dx/L*len, p.y - dy/L*len, p.x, p.y, af*0.9, false);
      }
    }

    // logo
    const x = box.x + U0*box.s, y = box.y + V0*box.s, w = UW*box.s, h = VH*box.s;
    lctx.clearRect(0, 0, W, H);
    const fp = clamp((t - T.form[0])/(T.form[1] - T.form[0]), 0, 1);
    const xp = clamp((t - T.exit[0])/(T.exit[1] - T.exit[0]), 0, 1);
    const fill = smooth(T.form[1] - 0.35, T.form[1] + 0.25, t);
    const mkAt = (c, cv, F) => c.drawImage(mk2, (F - U0)*cv.width/UW - cv.width, 0, 2*cv.width, cv.height);
    if (t < T.carve[0]) {
      // 1) la A pulita si vede solo dove la polvere si è posata; alla fine la maschera si chiude
      if (fill >= 1) lctx.drawImage(IMG.S, x, y, w, h);
      else if (t > T.form[0] - 0.8) {
        if (fill > 0) { acc.globalAlpha = fill*0.25; acc.fillStyle = '#fff'; acc.fillRect(0, 0, ac.width, ac.height); }
        acc.globalAlpha = 1;
        lcc.setTransform(1, 0, 0, 1, 0, 0); lcc.clearRect(0, 0, lc.width, lc.height);
        lcc.drawImage(IMG.S, 0, 0, lc.width, lc.height);
        lcc.globalCompositeOperation = 'destination-in';
        lcc.drawImage(ac, 0, 0, lc.width, lc.height);
        lcc.globalCompositeOperation = 'source-over';
        lctx.drawImage(lc, x, y, w, h);
      }
    } else if (xp <= 0 && t < T.carve[1]) {
      // 2) la folata attraversa la lettera: dove passa, la polvere del fiume si solleva (S → Bstay)
      //    e quella trascinata compare dove si deposita (Bmove attraverso la maschera degli arrivi)
      const cf = clamp((t - T.carve[0])/1.15, 0, 1), F = U0 - 60 + (UW + 120)*cf;
      carveFront = F;
      const endFill = smooth(T.carve[1] - 0.45, T.carve[1], t);
      if (endFill > 0) { acc2.globalAlpha = endFill*0.3; acc2.fillStyle = '#fff'; acc2.fillRect(0, 0, ac2.width, ac2.height); acc2.globalAlpha = 1; }
      lcc.setTransform(1, 0, 0, 1, 0, 0); lcc.clearRect(0, 0, lc.width, lc.height);
      lcc.drawImage(IMG.S, 0, 0, lc.width, lc.height);
      lcc.globalCompositeOperation = 'destination-in'; mkAt(lcc, lc, F);
      lcc.globalCompositeOperation = 'source-over';
      lcc2.clearRect(0, 0, lc2.width, lc2.height);
      lcc2.drawImage(IMG.Bstay, 0, 0, lc2.width, lc2.height);
      lcc2.globalCompositeOperation = 'destination-out'; mkAt(lcc2, lc2, F);
      lcc2.globalCompositeOperation = 'source-over';
      lcc3.clearRect(0, 0, lc3.width, lc3.height);
      lcc3.drawImage(IMG.Bmove, 0, 0, lc3.width, lc3.height);
      lcc3.globalCompositeOperation = 'destination-in'; lcc3.drawImage(ac2, 0, 0, lc3.width, lc3.height);
      lcc3.globalCompositeOperation = 'source-over';
      lctx.drawImage(lc, x, y, w, h);
      lctx.globalCompositeOperation = 'lighter';
      lctx.drawImage(lc2, x, y, w, h); lctx.drawImage(lc3, x, y, w, h);
      lctx.globalCompositeOperation = 'source-over';
    } else if (xp <= 0) {
      drawLogo(lctx, 1, t, x, y, w, h);
    } else if (xp < 1) {
      // uscita: il vento lo sgretola da sinistra a destra con un fronte frastagliato
      const e = easeInOut(xp), F = (0.1 + 0.8*e)*1254;
      lcc.setTransform(1, 0, 0, 1, 0, 0); lcc.clearRect(0, 0, lc.width, lc.height);
      drawLogo(lcc, 1, t, 0, 0, lc.width, lc.height);
      lcc.globalCompositeOperation = 'destination-in';
      lcc.drawImage(mk, (F - U0)*lc.width/UW - lc.width, 0, 2*lc.width, lc.height);
      lcc.globalCompositeOperation = 'source-over';
      lctx.drawImage(lc, x, y, w, h);
      for (let i = emitIdx; i < targets.length; i++) {         // lungo il fronte il logo diventa polvere
        const tg = targets[i];
        if (tg.gone) { if (i === emitIdx) emitIdx++; continue; }
        const lim = F + RAG[Math.min(255, (tg.v/1254*256)|0)]*1254;
        if (tg.u > lim) { if (tg.u > F + 0.2*1254) break; continue; }
        tg.gone = true;
        if (Math.random() > 0.8*budget) continue;
        blown.push({ x: box.x + tg.u*box.s, y: box.y + tg.v*box.s,
                     vx: (30 + Math.random()*140)*VS, vy: (-70 + Math.random()*110)*VS,
                     w: 0.35 + Math.random()*Math.random()*2.6,     // peso: i granelli leggeri volano via prima
                     life: 1.4 + Math.random()*1.6, age: 0, a: 0.18 + tg.l*0.5, big: tg.l > 0.85 && Math.random() < 0.25 });
      }
    }

    // granelli sollevati dalla folata: partono quando il fronte li raggiunge, volano col vento,
    // una parte si deposita nella bandiera e sui bordi del fiume, il resto viene portato via
    if (t >= T.carve[0] && t < T.carve[1] + 1.6) {
      const subs = budget > 0.7 ? 3 : budget > 0.45 ? 2 : 1;
      const keepAway = 0.75*budget;                     // su dispositivi lenti meno polvere portata via
      for (let i = 0; i < MV.length; i++) {
        const m = MV[i];
        if (m.away && m.keep > keepAway) continue;
        if (!m.t0) {
          if (t < T.carve[1] && m.su <= carveFront + RAG[Math.min(255, (m.sv/1254*256)|0)]*1254) {
            m.t0 = t; m.x = m.su; m.y = m.sv;
          } else continue;
        }
        const tau = (t - m.t0)/m.dur;
        if (tau > 1.25) continue;
        const e = tau < 1 ? (1 - Math.cos(Math.PI*clamp(tau, 0, 1)))/2 : 1, bell = Math.sin(Math.PI*clamp(tau, 0, 1));
        const n1 = noise(m.ph, t*1.1) - 0.5, n2 = noise(m.ph + 7, t*1.3) - 0.5;
        const nx = m.su + (m.tu - m.su)*e + n1*46*bell;
        const ny = m.sv + (m.tv - m.sv)*e - 22*bell + n2*30*bell;
        const alpha = 0.55*m.a*Math.min(1, tau*5)*(m.away ? 1 - smooth(0.35, 1, tau) : 1 - smooth(0.9, 1.25, tau));
        // la polvere portata via si allarga man mano (si disperde nell'aria), quella che si posa si ricompatta
        const spread = m.away ? 10 + 110*clamp(tau, 0, 1) : 14*bell;
        for (let j = 0; j < subs; j++) {
          // ogni sotto-granello ha una sua direzione fissa: la nuvola si apre senza altro rumore da calcolare
          const ox = (SUB[j][0] + n2*0.5)*spread*0.6, oy = (SUB[j][1] + n1*0.5)*spread;
          queue(box.x + (m.x + ox)*box.s, box.y + (m.y + oy)*box.s, box.x + (nx + ox)*box.s, box.y + (ny + oy)*box.s, alpha, j === 0 && m.a > 0.75);
        }
        if (!m.away) {
          if (tau > 0.7 && tau < 1) deposit(nx, ny, 0.05, 11, acc2);         // polvere che si posa lungo l'arrivo
          if (tau >= 1 && !m.done) { m.done = 1; deposit(m.tu, m.tv, 0.85, 17, acc2); }
        }
        m.x = nx; m.y = ny;
      }
    }

    for (let i = blown.length - 1; i >= 0; i--) {
      const p = blown[i];
      p.age += dt;
      if (p.age > p.life) { blown[i] = blown[blown.length - 1]; blown.pop(); continue; }
      flow(p.x, p.y, t);
      const k = 1 - Math.exp(-dt*p.w);
      p.vx += (f[0] - p.vx)*k; p.vy += (f[1]*1.6 - p.vy)*k;
      p.x += p.vx*dt; p.y += p.vy*dt;
      const sp = Math.hypot(p.vx, p.vy) || 1, len = Math.min(4 + 26*VS, 0.5 + sp*0.035);
      queue(p.x - p.vx/sp*len, p.y - p.vy/sp*len, p.x, p.y, p.a*(1 - p.age/p.life)*Math.min(1, p.age*8), p.big);
    }
    air.flush(ctx);
    settle.flush(lctx);

    // home
    const hp = easeOut(clamp((t - T.home[0])/(T.home[1] - T.home[0]), 0, 1));
    setTitle(hp);
    intro.style.opacity = (1 - smooth(T.home[0] + 0.1, T.end, t)).toFixed(3);
  }
  function setTitle(hp) {
    title.style.opacity = hp.toFixed(3);
    const ls = (0.42 - 0.26*hp).toFixed(3);
    title.style.letterSpacing = ls + 'em'; title.style.marginRight = '-' + ls + 'em';
  }

  // ---- regia ----------------------------------------------------------------
  // il tempo dell'animazione avanza al massimo di 1/20 s per fotogramma: su un dispositivo lento
  // l'intro rallenta un attimo invece di saltare pezzi
  let t = 0, last = 0, raf = 0, running = false, budget = 1, slow = [];
  function frame(now) {
    const real = last ? (now - last)/1000 : 1/60; last = now;
    const dt = Math.min(real, 1/20);
    t += dt;
    step(t, dt);
    // qualità adattiva: si misura il tempo reale dei fotogrammi; se il dispositivo fatica si usa
    // meno polvere (e, all'inizio, una risoluzione più bassa) invece di andare a scatti
    slow.push(real);
    if (slow.length >= 24) {
      const med = slow.slice().sort((a, b) => a - b)[12];
      if (med > 0.022 && budget > 0.25) {
        const k = med > 0.04 ? 0.6 : 0.8;
        budget *= k;
        ambient.length = Math.round(ambient.length*k);
        if (blown.length > 400) blown.length = Math.round(blown.length*k);
        if (t < T.dustIn[1] && DPR > 1) { DPR_MAX = med > 0.04 ? 1 : 1.5; resize(); }
      }
      slow.length = 0;
    }
    if (t < T.end) raf = requestAnimationFrame(frame); else finish();
  }
  function finish() {
    cancelAnimationFrame(raf); running = false;
    intro.classList.add('gone'); setTitle(1);
  }
  function skip() {                   // click o tasto: salta alla home
    if (!running) return;
    running = false; cancelAnimationFrame(raf);
    intro.style.transition = 'opacity .45s ease'; intro.style.opacity = '0';
    title.style.transition = 'opacity .6s ease, letter-spacing .6s ease, margin .6s ease';
    requestAnimationFrame(() => setTitle(1));
    setTimeout(() => { intro.classList.add('gone'); intro.style.transition = ''; title.style.transition = ''; }, 500);
  }
  function play() {
    cancelAnimationFrame(raf);
    intro.classList.remove('gone'); intro.style.opacity = '1'; setTitle(0);
    formers = []; blown = []; formed = false; emitIdx = 0; carveFront = -1e9;
    acc.clearRect(0, 0, ac.width, ac.height); acc2.clearRect(0, 0, ac2.width, ac2.height);
    MV.forEach(m => { m.t0 = 0; m.done = 0; }); t = 0; last = 0; slow = []; budget = 1; DPR_MAX = 2;
    targets.forEach(tg => { tg.gone = false; });
    resize();
    makeAmbient(Math.round(clamp(W*H/340, 1100, 3400)*budget));
    lctx.clearRect(0, 0, W, H); ctx.clearRect(0, 0, W, H);
    running = true;
    if (reduce) {                     // movimento ridotto: solo dissolvenze
      const x = box.x + U0*box.s, y = box.y + V0*box.s;
      lv.style.opacity = '0'; lv.style.transition = 'opacity .7s ease';
      drawLogo(lctx, 1, 0, x, y, UW*box.s, VH*box.s);
      requestAnimationFrame(() => { lv.style.opacity = '1'; });
      intro.style.transition = 'opacity .7s ease'; title.style.transition = 'opacity .7s ease';
      setTimeout(() => { intro.style.opacity = '0'; setTitle(1); }, 1900);
      setTimeout(() => { intro.classList.add('gone'); running = false; lv.style.opacity = ''; }, 2700);
      return;
    }
    raf = requestAnimationFrame(frame);
  }

  intro.addEventListener('pointerdown', skip);
  window.addEventListener('keydown', e => { if (running && !e.metaKey && !e.ctrlKey) skip(); });
  title.addEventListener('dblclick', () => { if (!running) play(); });   // doppio click: rivedi l'apertura
  window.addEventListener('resize', () => { if (running) resize(); });

  ready.then(() => { sampleLogo(); play(); });
})();
</script>
</body>
</html>
