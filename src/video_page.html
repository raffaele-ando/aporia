<title>Aporia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&display=swap">
<style>
  /* un solo mondo visivo, scuro per scelta: fondo e colori sempre espliciti */
  :root { color-scheme: dark; --night: #000; --paper: #ece8e1; --home-bg: #000; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--night); color: var(--paper); overflow: hidden; }

  #home { position: fixed; inset: 0; display: grid; place-items: center; background: var(--home-bg); padding-inline: 16px; }
  #home h1 {
    margin: 0; font-family: "Italiana", "Didot", "Bodoni 72", "Bodoni MT", "Times New Roman", serif;
    font-weight: 400; font-size: clamp(56px, 13vw, 200px); line-height: 1;
    letter-spacing: 0.16em; margin-right: -0.16em;
    color: var(--paper); cursor: default; user-select: none; -webkit-user-select: none;
    opacity: 0; transition: opacity .9s ease, letter-spacing 1.1s cubic-bezier(.2,.7,.2,1), margin 1.1s cubic-bezier(.2,.7,.2,1);
  }
  body.home #home h1 { opacity: 1; }
  body:not(.home) #home h1 { letter-spacing: 0.42em; margin-right: -0.42em; }

  #intro { position: fixed; inset: 0; background: var(--night); transition: opacity .6s ease; }
  /* il video riempie sempre tutto lo schermo (niente bande nere): il logo sta nella zona centrale
     che resta visibile con qualsiasi proporzione */
  #intro video { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--night); }
  body.home #intro { opacity: 0; pointer-events: none; }
</style>

<main id="home" aria-live="polite"><h1 id="homeTitle">Aporia</h1></main>

<div id="intro" role="img" aria-label="Aporia">
  <video id="film" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
</div>

<script>
(() => {
  'use strict';
  // il video è una simulazione di vento e polvere già calcolata (src/sim_video.py):
  // il telefono deve solo riprodurlo, quindi è fluido ovunque
  const film = document.getElementById('film'), body = document.body;
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const portrait = () => window.innerHeight >= window.innerWidth;
  let done = false, watchdog = 0;

  function toHome() {
    if (done) return; done = true;
    clearTimeout(watchdog);
    body.classList.add('home');
    setTimeout(() => { try { film.pause(); } catch (e) {} }, 700);
  }
  function play() {
    done = false; body.classList.remove('home');
    // H.264 (Safari, iPad, Android, Chrome); WebM VP9 dove l'H.264 non c'è
    const ext = film.canPlayType('video/mp4; codecs="avc1.640028"') ? 'mp4' : 'webm';
    film.src = `assets/intro-${portrait() ? 'portrait' : 'landscape'}.${ext}`;
    film.currentTime = 0;
    // se il video non parte (risparmio energetico, rete lenta) si va comunque alla home
    watchdog = setTimeout(toHome, 2500);
    film.addEventListener('playing', () => { clearTimeout(watchdog); watchdog = setTimeout(toHome, 7000); }, { once: true });
    const p = film.play();
    if (p && p.catch) p.catch(toHome);
  }
  // la home compare mentre l'ultima polvere si sta ancora disperdendo
  film.addEventListener('timeupdate', () => { if (film.duration && film.currentTime > film.duration - 0.55) toHome(); });
  film.addEventListener('ended', toHome);
  film.addEventListener('error', toHome);

  document.getElementById('intro').addEventListener('pointerdown', toHome);        // tocco: salta
  window.addEventListener('keydown', e => { if (!e.metaKey && !e.ctrlKey) toHome(); });
  document.getElementById('homeTitle').addEventListener('dblclick', play);         // doppio click: rivedi

  if (reduce) { requestAnimationFrame(toHome); } else play();
})();
</script>
