# Il sito (GitHub Pages) si pubblica dal ramo gh-pages: a ogni push su main lo si riallinea.
name: Pubblica il sito
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Allinea gh-pages a main
        run: git push --force origin HEAD:refs/heads/gh-pages
